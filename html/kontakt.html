<head>

  <link rel="icon" type="image/x-icon" href="../picture/vs.svg" />
  <title>Kontakt</title>
  <script defer src="../js/main.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body class="kontakt-page">
  <a href="#main-content" class="skip-link">Zum Hauptinhalt springen</a>
  <div class="container">
    <nav class="nav">
      <button class="menu-toggle" aria-controls="nav-menu" aria-haspopup="true" aria-expanded="false"
        aria-label="Menü öffnen">☰</button>
      <ul class="nav-menu" id="nav-menu">
        <li><a class="nav-link" id="projekte-link" href="../html/projekte.html"><span>Projekte</span></a></li>
        <li><a class="nav-link" id="me-link" href="../html/me.html"><span>Me</span></a></li>
        <li><a class="nav-link" id="lebenslauf-link" href="../html/lebenslauf.html"><span>Lebenslauf</span></a></li>
        <li><a class="nav-link" id="home-link" href="../index.html"><span>Home</span></a></li>
      </ul>
    </nav>

    <div class="content-wrapper">
      <header class="header">
        <div class="profile-section">
          <div class="profile-picture-container">
            <img src="../picture/Vadim.jpg" alt="Ich, der auf einem Bild zu sehen ist" loading="lazy"
              class="profile-picture" id="profile-picture">
          </div>

          <!-- Social Media Icons direkt unter dem Bild -->
          <div class="social-media-buttons-profile">
            <a href="https://www.vavira.de" class="social-media-link" target="_blank"
              aria-label="Zu meiner Webseite Vavira">
              <i class="fas fa-briefcase" aria-hidden="true"></i>
            </a>
            <a href="https://github.com/IU-Webprogrammierung/web-programmierung-vadimstyr.git" class="social-media-link"
              target="_blank" aria-label="Zu meinem GitHub-Profil">
              <i class="fab fa-github" aria-hidden="true"></i>
            </a>
            <a href="https://www.xing.com/profile/vadim_styr017633" class="social-media-link" target="_blank"
              aria-label="Zu meinem XING-Profil">
              <i class="fab fa-xing" aria-hidden="true"></i>
            </a>
            <a href="https://www.linkedin.com/in/vadim-styr-3244261b8/" class="social-media-link" target="_blank"
              aria-label="Zu meinem LinkedIn-Profil">
              <i class="fab fa-linkedin-in" aria-hidden="true"></i>
            </a>
            <a href="mailto:Vadimstyr@googlemail.com" class="social-media-link"
              aria-label="E-Mail an Vadimstyr@googlemail.com">
              <i class="fas fa-envelope" aria-hidden="true"></i>
            </a>
          </div>
        </div>
      </header>

      <!-- Kontaktformular -->
      <section class="contact-form-section" id="main-content">
        <h2 class="contact-heading">Kontakt aufnehmen</h2>
        <p class="contact-intro">Haben Sie Fragen oder Anregungen? Füllen Sie einfach das Formular aus und ich melde mich bei Ihnen!</p>
        
        <form class="contact-form" action="#" method="post">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Ihr Name" required>
          </div>
          
          <div class="form-group">
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" placeholder="Ihre E-Mail-Adresse" required>
          </div>
          
          <div class="form-group">
            <label for="subject">Betreff</label>
            <input type="text" id="subject" name="subject" placeholder="Betreff Ihrer Anfrage">
          </div>
          
          <div class="form-group">
            <label for="message">Nachricht</label>
            <textarea id="message" name="message" rows="6" placeholder="Ihre Nachricht" required></textarea>
          </div>
          
          <div class="form-group">
            <input type="checkbox" id="datenschutz" name="datenschutz" required>
            <label for="datenschutz">Ich stimme zu, dass meine Angaben zur Kontaktaufnahme verwendet werden. Hinweise zum Widerruf und Datenschutz finde ich im Impressum.</label>
          </div>
          
          <button type="submit" class="submit-button">Nachricht senden</button>
        </form>
      </section>
    </div>

    <footer class="impressum-footer"id="impressum-footer-kontakt">
      <p><a href="../html/impressum.html" class="impressum-link">Impressum</a></p>
    </footer>
  </div>
</body>

</html>
