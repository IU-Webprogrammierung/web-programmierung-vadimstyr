<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/ki-style.css">
  <title>KI Desktop</title>
</head>

<body>
  <h1>KI Desktop</h1>
  <form>
    <div class="group-field-button">
      <div class="form-group">
        <label for="Nachricht">Nachricht:</label>
        <input type="text" id="nachricht" name="Nachricht" aria-placeholder="Geben Sie ihre Nachricht ein">
      </div>
      <div class="button-group">
        <button type="submit" id="abschicken">Abschicken</button>
        <button type="reset" id="zuruecksetzen">Zurücksetzen</button>
      </div>
    </div>
  </form>

</body>

</html>
